name: iPhone camera capture regression
on:
  pull_request:
    paths:
      - 'scripts/camera-stability/**'
      - 'scripts/scanner-paper/**'
      - 'scripts/v110331/captureWindow.js'
      - '.github/workflows/camera-stability.yml'
permissions:
  contents: read
concurrency:
  group: camera-stability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  camera:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      READER_OFFLINE_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Camera, timing and paper regressions
        run: node --test scripts/camera-stability/camera.test.mjs scripts/scanner-paper/core.test.mjs
      - name: Exact production build and protected runtime locks
        run: node scripts/build-v110.mjs > /tmp/camera-build.log 2>&1 || { tail -n 100 /tmp/camera-build.log; exit 1; }
      - name: Install isolated UI test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1 react-test-renderer@18.3.1
          npx playwright install --with-deps chromium webkit
      - name: Delayed capture and mode transitions
        run: node --test scripts/camera-stability/adapter.test.mjs
      - name: iPhone PWA capture and original file persistence
        run: |
          npx next start --hostname 127.0.0.1 --port 3000 > /tmp/camera-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/app-version.json >/dev/null; then break; fi
            sleep 1
          done
          node scripts/camera-stability/browser.mjs
          CAMERA_TEST_BROWSER=webkit node scripts/camera-stability/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: camera-stability-evidence
          path: |
            browser-test-results/camera-stability/
            /tmp/camera-build.log
            /tmp/camera-server.log
          retention-days: 3
