name: Automatic document reading and filing
on:
  pull_request:
    paths:
      - 'lib/reader-ai/**'
      - 'scripts/reader-auto/**'
      - 'packages/smart-reader-core/**'
      - '.github/workflows/reader-auto.yml'
permissions:
  contents: read
concurrency:
  group: reader-auto-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      READER_OFFLINE_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test scripts/reader-auto/core.test.mjs scripts/reader-auto/server.test.mjs
      - name: Build exact production runtime and verify protected files
        run: node scripts/build-v110.mjs > /tmp/reader-auto-build.log 2>&1 || { tail -n 100 /tmp/reader-auto-build.log; exit 1; }
      - run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium webkit
      - name: Automatic filing, ambiguous matches, failures and original bytes
        run: |
          npx next start --hostname 127.0.0.1 --port 3000 > /tmp/reader-auto-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/app-version.json >/dev/null; then break; fi
            sleep 1
          done
          node scripts/reader-auto/browser.mjs
          READER_AUTO_BROWSER=webkit node scripts/reader-auto/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automatic-document-evidence
          path: |
            browser-test-results/reader-auto/
            /tmp/reader-auto-build.log
            /tmp/reader-auto-server.log
          retention-days: 3
