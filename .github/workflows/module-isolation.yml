name: Module isolation regression
on:
  push:
    branches: [main, fix/module-isolation-20260906, fix/logbook-editor-20260906, fix/logbook-followup-v11021-20260906, fix/compact-handle-resize-v11022-20260907, fix/motive-override-chips-11023-20260906]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: module-isolation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Capture versioned build inputs
        run: git ls-files -z source scripts lib app pages public package.json package-lock.json 'next.config.*' vercel.json module-locks.v1.json | tar --null -T - -czf /tmp/owner-op-versioned.tar.gz
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Exact production build and behavioral contracts
        run: node scripts/build-v110.mjs 2>&1 | tee /tmp/owner-op-build.log
      - name: Capture materialized runtime
        if: always()
        run: |
          find source scripts lib app pages public -type f 2>/dev/null > /tmp/owner-op-runtime-files.txt || true
          printf '%s\n' package.json package-lock.json module-locks.v1.json >> /tmp/owner-op-runtime-files.txt
          tar -T /tmp/owner-op-runtime-files.txt -czf /tmp/owner-op-materialized.tar.gz
      - name: Architecture contracts
        run: npm run verify:architecture
      - name: Existing Logbook regressions
        run: |
          node scripts/verify-shipping-doc-sign-loop-v962.mjs
          node scripts/verify-sign-minute-boundary-v963.mjs
          node scripts/verify-historical-location-isolation-v962.mjs
          node scripts/verify-day-export-import-v9600.mjs
      - name: Install isolated browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium webkit
      - name: Real browser sign, editor, override, GPS and service-worker checks
        run: |
          npx next start --hostname 127.0.0.1 --port 3000 > /tmp/owner-op-test-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/app-version.json >/dev/null; then break; fi
            sleep 1
          done
          failed=0
          for test in browser-isolation-v110 browser-logbook-editor-v110 browser-compact-editor-v111 browser-resize-grabbers-v111 browser-logbook-followup-v11021 browser-motive-override-v11023 browser-service-worker-v110; do
            if ! node scripts/$test.mjs 2>&1 | tee /tmp/$test.log; then failed=1; fi
          done
          exit "$failed"
      - name: Verify exact production deployment and isolated hosted editor
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node scripts/verify-production-v11021.mjs
          TEST_ORIGIN=https://owner-op-road-ready.vercel.app node scripts/browser-logbook-followup-v11021.mjs
          TEST_ORIGIN=https://owner-op-road-ready.vercel.app node scripts/browser-compact-editor-v111.mjs
          TEST_ORIGIN=https://owner-op-road-ready.vercel.app node scripts/browser-motive-override-v11023.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-op-browser-tests
          path: |
            browser-test-results/
            /tmp/owner-op-test-server.log
            /tmp/owner-op-build.log
            /tmp/browser-*.log
            /tmp/owner-op-versioned.tar.gz
            /tmp/owner-op-materialized.tar.gz
          retention-days: 3
