name: Module isolation regression
on:
  push:
    branches: [fix/module-isolation-20260906]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: module-isolation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Archive test dependencies
        run: tar -czf /tmp/owner-op-test-deps.tar.gz node_modules/dexie
      - uses: actions/upload-artifact@v4
        with:
          name: owner-op-test-deps
          path: /tmp/owner-op-test-deps.tar.gz
          retention-days: 3
      - name: Exact production build
        run: node scripts/build-v110.mjs
      - name: Archive materialized source for audit
        if: always()
        run: tar -czf /tmp/owner-op-materialized.tar.gz source lib scripts app public package.json release-version.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-op-materialized
          path: /tmp/owner-op-materialized.tar.gz
          retention-days: 3
      - name: Architecture contracts
        run: npm run verify:architecture
      - name: Logbook certification regression
        run: |
          node scripts/verify-shipping-doc-sign-loop-v962.mjs
          node scripts/verify-sign-minute-boundary-v963.mjs
          node scripts/verify-historical-location-isolation-v962.mjs
          node scripts/verify-day-export-import-v9600.mjs
