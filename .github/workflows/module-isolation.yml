name: Module isolation regression
on:
  push:
    branches: [fix/module-isolation-20260906]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: module-isolation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked source for reproducible audit
        run: git archive --format=tar.gz HEAD > /tmp/owner-op-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: owner-op-source
          path: /tmp/owner-op-source.tar.gz
          retention-days: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Architecture contracts
        run: npm run verify:architecture
      - name: Logbook certification regression
        run: |
          node scripts/verify-shipping-doc-sign-loop-v962.mjs
          node scripts/verify-sign-minute-boundary-v963.mjs
          node scripts/verify-historical-location-isolation-v962.mjs
          node scripts/verify-day-export-import-v9600.mjs
