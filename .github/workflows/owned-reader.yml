name: Owned document reader
on:
  pull_request:
    branches: [main, fix/scanner-capture-reader-v110334]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: owned-reader-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-and-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test packages/smart-reader-core/test/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/owned-ocr/requirements.txt
      - run: |
          python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r experiments/owned-ocr/requirements.txt
          python -m unittest discover -s experiments/owned-ocr -p 'test_*.py' -v
  app-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Exact production build and behavioral contracts
        run: node scripts/build-v110.mjs 2>&1 | tee /tmp/owned-reader-build.log
      - name: Architecture and isolation
        run: npm run verify:architecture
      - run: |
          npm install --no-save --package-lock=false playwright@1.55.1 pdf-lib@1.17.1
          npx playwright install --with-deps chromium webkit
      - name: Source review and scanner regression in Chromium and WebKit
        run: |
          npx next start --hostname 127.0.0.1 --port 3000 > /tmp/owned-reader-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/app-version.json >/dev/null; then break; fi
            sleep 1
          done
          node scripts/browser-owned-reader.mjs
          node scripts/browser-native-pdf-v110363.mjs
          TEST_NATIVE_CELLS=1 node scripts/browser-native-pdf-v110363.mjs
          node scripts/browser-scanner-capture-v110329.mjs
          node scripts/browser-scanner-workflow-v110328.mjs
          node scripts/browser-saved-documents-v110344.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owned-reader-evidence
          path: |
            browser-test-results/owned-reader/
            browser-test-results/scanner-capture-v110329/
            browser-test-results/scanner-workflow-v110328/
            browser-test-results/saved-documents-v110344/
            /tmp/owned-reader-build.log
            /tmp/owned-reader-server.log
          retention-days: 7
