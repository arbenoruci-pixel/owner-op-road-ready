name: Owned document reader
on:
  pull_request:
    branches: [main, fix/scanner-capture-reader-v110334]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: owned-reader-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-and-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test packages/smart-reader-core/test/*.test.mjs
      - run: node --test experiments/owned-ocr/test-*.mjs
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/owned-ocr/requirements.txt
      - run: |
          python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r experiments/owned-ocr/requirements.txt
          python -m unittest discover -s experiments/owned-ocr -p 'test_*.py' -v
  app-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Exact production build and behavioral contracts
        run: |
          set -o pipefail
          node scripts/build-v110.mjs 2>&1 | tee /tmp/owned-reader-build.log
      - name: Architecture and isolation
        run: npm run verify:architecture
      - run: |
          npm install --no-save --package-lock=false playwright@1.55.1 pdf-lib@1.17.1
          npx playwright install --with-deps chromium webkit
      - name: Source review and scanner regression in Chromium and WebKit
        run: |
          npx next start --hostname 127.0.0.1 --port 3000 > /tmp/owned-reader-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/app-version.json >/dev/null; then break; fi
            sleep 1
          done
          # Check the changed BOL/source flow first so a failure produces
          # diagnostics immediately. The complete suite still gates success.
          node scripts/v110393/browser-bol-source.mjs
          node scripts/v110384/browser-rows.mjs
          node scripts/browser-ratecon-structure-v110388.mjs
          reader_test_status=0
          node scripts/browser-fullscreen-reader-v110369.mjs || reader_test_status=1
          node scripts/v110373/browser-reader-evidence.mjs || reader_test_status=1
          node scripts/v110382/browser-bol.mjs || reader_test_status=1
          TEST_DAMAGED_BOL=1 node scripts/v110382/browser-bol.mjs || reader_test_status=1
          node scripts/browser-owned-reader.mjs || reader_test_status=1
          node scripts/browser-native-pdf-v110363.mjs || reader_test_status=1
          TEST_NATIVE_CELLS=1 node scripts/browser-native-pdf-v110363.mjs || reader_test_status=1
          node scripts/browser-scanner-capture-v110329.mjs || reader_test_status=1
          node scripts/browser-scanner-workflow-v110328.mjs || reader_test_status=1
          node scripts/browser-saved-documents-v110344.mjs || reader_test_status=1
          exit "$reader_test_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owned-reader-evidence
          path: |
            browser-test-results/fullscreen-reader-v110369/
            browser-test-results/owned-reader/
            browser-test-results/reader-evidence-v110373/
            browser-test-results/bol-quality-v110382/
            browser-test-results/bol-recovery-v110383/
            browser-test-results/bol-rows-v110384/
            browser-test-results/bol-source-v110393/
            browser-test-results/ratecon-structure-v110388/
            browser-test-results/scanner-capture-v110329/
            browser-test-results/scanner-workflow-v110328/
            browser-test-results/saved-documents-v110344/
            /tmp/owned-reader-build.log
            /tmp/owned-reader-server.log
          retention-days: 7
