name: Phase 1 Step 2B signed Auth integration
on:
  push:
    branches: [roadready/phase1-step2-document-pipeline]
    paths:
      - '.github/workflows/rr-step2b-auth.yml'
      - 'scripts/lease-operator/step2b*'
      - 'lib/rr-lease/operator-api.js'
      - 'app/api/operator/**'
      - 'supabase/migrations/20261126*_rr_phase1_*.sql'
      - 'scripts/lease-operator/packet*.mjs'
permissions:
  contents: read
jobs:
  signed-auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: rr_step2b_auth
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d rr_step2b_auth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: local-test-only
      PGDATABASE: rr_step2b_auth
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Prepare isolated catalog
        run: psql -v ON_ERROR_STOP=1 -f scripts/lease-operator/step2b.auth.bootstrap.sql
      - name: Start real GoTrue Auth
        run: |
          set -euo pipefail
          # GoTrue migrations use unqualified names as well as auth-qualified names.
          # Give only the disposable Auth migration connection an auth-first search path.
          psql -v ON_ERROR_STOP=1 -c "create role step2b_auth_admin login superuser password 'local-auth-only'; alter role step2b_auth_admin in database rr_step2b_auth set search_path to auth,public;"
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "TEST_JWT_SECRET=$secret" >> "$GITHUB_ENV"
          docker run -d --name step2b-auth --network host \
            -e GOTRUE_API_HOST=0.0.0.0 -e GOTRUE_API_PORT=9999 \
            -e API_EXTERNAL_URL=http://127.0.0.1:9999 -e GOTRUE_SITE_URL=http://localhost \
            -e GOTRUE_DB_DRIVER=postgres -e GOTRUE_DB_NAMESPACE=auth \
            -e GOTRUE_DB_DATABASE_URL=postgres://step2b_auth_admin:local-auth-only@127.0.0.1:5432/rr_step2b_auth \
            -e GOTRUE_JWT_SECRET="$secret" -e GOTRUE_JWT_AUD=authenticated \
            -e GOTRUE_JWT_DEFAULT_GROUP_NAME=authenticated -e GOTRUE_JWT_EXP=3600 \
            -e GOTRUE_EXTERNAL_EMAIL_ENABLED=true -e GOTRUE_MAILER_AUTOCONFIRM=true \
            -e GOTRUE_DISABLE_SIGNUP=false supabase/gotrue:v2.158.1
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:9999/health >/dev/null; then exit 0; fi
            if [ "$(docker inspect --format '{{.State.Running}}' step2b-auth)" = false ]; then docker logs step2b-auth; exit 1; fi
            sleep 2
          done
          docker logs step2b-auth
          exit 1
      - name: Apply reviewed migrations and Step 2B
        run: |
          set -euo pipefail
          for m in supabase/migrations/20261126073000_* \
            supabase/migrations/20261126111000_* \
            supabase/migrations/20261126120000_* \
            supabase/migrations/20261126130000_* \
            supabase/migrations/20261126143000_* \
            supabase/migrations/20261126153849_* \
            supabase/migrations/20261126153937_* \
            supabase/migrations/20261126154155_* \
            supabase/migrations/20261126154238_* \
            supabase/migrations/20261126161056_* \
            supabase/migrations/20261126173000_* \
            supabase/migrations/20261126184000_*; do
            psql -v ON_ERROR_STOP=1 -f "$m"
          done
      - name: Start PostgREST with JWT verification
        run: |
          set -euo pipefail
          docker run -d --name step2b-rest --network host \
            -e PGRST_DB_URI=postgres://authenticator:local-rest-only@127.0.0.1:5432/rr_step2b_auth \
            -e PGRST_DB_SCHEMAS=public -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$TEST_JWT_SECRET" -e PGRST_SERVER_PORT=3000 postgrest/postgrest:v12.2.3
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs step2b-rest
          exit 1
      - name: Install pinned repository dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Signed real Auth sessions, concurrent requests, RLS isolation
        run: node scripts/lease-operator/step2b.auth.test.mjs
      - name: Packet guard and settlement tests
        run: |
          node --test --test-name-pattern='packet preserves|refuses unmatched|blocks intermediate' scripts/lease-operator/packet.test.mjs
          node --test scripts/lease-operator/intake-contract.test.mjs
      - name: Remove local test containers
        if: always()
        run: docker rm -f step2b-auth step2b-rest || true
