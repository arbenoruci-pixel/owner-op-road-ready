name: Authorized original logbook recovery
on:
  pull_request:
    paths:
      - 'scripts/logbook-restore/**'
      - '.github/workflows/logbook-original-recovery.yml'
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Exact production build and protected contracts
        run: node scripts/build-v110.mjs > /tmp/recovery-build.log 2>&1 || { tail -n 100 /tmp/recovery-build.log; exit 1; }
      - name: Install browser engines
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium webkit
      - name: Original records through phone recovery and reload
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3000 > /tmp/recovery-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/app-version.json >/dev/null; then break; fi
            sleep 1
          done
          node scripts/logbook-restore/browser.mjs
