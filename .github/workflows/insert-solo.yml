name: Insert continuity and Solo
on:
  pull_request:
    paths:
      - 'scripts/insert-continuity/**'
      - 'scripts/solo-driver/**'
      - 'scripts/finalize-insert-solo-v110469.mjs'
      - 'scripts/finalize-signed-rate-v110466.mjs'
      - '.github/workflows/insert-solo.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/insert-continuity/**'
      - 'scripts/solo-driver/**'
      - 'scripts/finalize-insert-solo-v110469.mjs'
      - '.github/workflows/insert-solo.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Exact production build and continuity regressions
        run: node scripts/build-v110.mjs > /tmp/insert-solo-build.log 2>&1 || { tail -n 120 /tmp/insert-solo-build.log; exit 1; }
      - name: Chromium and iPhone WebKit user flows
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium webkit
          npx next start --hostname 127.0.0.1 --port 3000 > /tmp/insert-solo-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/app-version.json >/dev/null; then break; fi
            sleep 1
          done
          node scripts/insert-continuity/browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: insert-solo-evidence
          path: |
            browser-test-results/insert-solo/
            /tmp/insert-solo-build.log
            /tmp/insert-solo-server.log
          retention-days: 3
