name: GPS, DOT Inspection and signing
on:
  pull_request:
    paths:
      - 'scripts/v110421/**'
      - 'scripts/finalize-gps-sign-dot-v110421.mjs'
      - 'scripts/build-v110.mjs'
      - '.github/workflows/gps-sign-dot.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Exact production build and regression checks
        run: node scripts/build-v110.mjs > /tmp/gps-sign-build.log 2>&1 || { tail -n 100 /tmp/gps-sign-build.log; exit 1; }
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Phone browser GPS, DOT save, sign and reload
        run: |
          npx next start --hostname 127.0.0.1 --port 3000 > /tmp/gps-sign-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/app-version.json >/dev/null; then break; fi
            sleep 1
          done
          node scripts/v110421/browser-gps-sign.mjs
          node scripts/v110409/browser-edit-gps.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gps-sign-dot-evidence
          path: |
            browser-test-results/gps-sign-v110421/
            browser-test-results/edit-gps-v110409/
            /tmp/gps-sign-build.log
            /tmp/gps-sign-server.log
          retention-days: 7
