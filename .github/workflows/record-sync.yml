name: Device record synchronization
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/v110451/**'
      - 'scripts/v110453/**'
      - 'scripts/v110455/**'
      - 'scripts/v110458/**'
      - 'scripts/v110431/**'
      - 'lib/local-db/safetyArchive.js'
      - 'scripts/finalize-evidence-workspace-v110453.mjs'
      - 'scripts/finalize-record-sync-v110451.mjs'
      - 'scripts/finalize-cloud-mirror-v110450.mjs'
      - '.github/workflows/record-sync.yml'
permissions:
  contents: read
concurrency:
  group: record-sync-${{ github.ref }}
  cancel-in-progress: true
jobs:
  records:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/v110451/test-records.mjs
      - run: node scripts/v110453/test-core.mjs
      - name: Exact production build
        run: node scripts/build-v110.mjs > /tmp/record-build.log 2>&1 || { tail -n 100 /tmp/record-build.log; exit 1; }
      - run: node scripts/v110453/test-packet.mjs
      - name: Account sync and binary storage unit regressions
        run: |
          node scripts/v110455/account-core.test.mjs
          node scripts/v110455/account-files.test.mjs
          node scripts/v110455/account-regression.test.mjs
          node scripts/v110458/binary-storage.test.mjs
      - name: Install isolated browser test
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Receive safety and Blob/File storage regressions
        run: |
          node scripts/v110455/browser-receive-safety.mjs
          node scripts/v110458/browser-binary-storage.mjs
      - name: Record sync and correction flow
        run: |
          npx next start --hostname 127.0.0.1 --port 3000 > /tmp/record-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/app-version.json >/dev/null; then break; fi
            sleep 1
          done
          node scripts/v110451/browser-records.mjs
          node scripts/v110453/browser-workspace.mjs
          node scripts/v110450/browser-mirror.mjs
          node scripts/v110455/browser-account.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: record-sync-v110451-evidence
          path: |
            browser-test-results/cloud-records-v110451.png
            browser-test-results/evidence-workspace-v110453.png
            /tmp/record-build.log
            /tmp/record-server.log
          retention-days: 7
